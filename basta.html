<html>
<head>
<script>
function getCoords(event){
	let grid_size = 3;
	const links = [
		{link_grid}
	];
	let x = event.offsetX;
	let y = event.offsetY;
	let w = event.target.clientWidth;
	let h = event.target.clientHeight;
	console.log(x  + ","+y);
	let hor = Math.floor(x* grid_size/w);
	let ver = Math.floor(y* grid_size/h);
	grid_area = hor+(grid_size*ver);
	console.log(hor + ","+ver + "=" + grid_area + " -> " + links[grid_area]);
	window.location.href=links[grid_area];
}
</script>
</head>
<body bgcolor="#000000">
<img src="{image}" width="100%" onclick="getCoords(event)" />
<a href="index.html"><hr/></a>
